<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost & Found Portal - Registration</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #1e3c72, #2a5298);
        }

        .container{
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .container h1{
            text-align: center;
            margin-bottom: 25px;
            color: #1e3c72;
        }

        .input-box{
            margin-bottom: 18px;
        }

        .input-box label{
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .input-box input{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .input-box input:focus{
            border-color: #2a5298;
        }

        .btn{
            width: 100%;
            padding: 12px;
            border: none;
            background: #1e3c72;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover{
            background: #2a5298;
        }

        .login-link{
            text-align: center;
            margin-top: 15px;
        }

        .login-link a{
            color: #1e3c72;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Lost & Found Portal</h1>

        <form action="/register" method="POST">

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" name="fullname" placeholder="Enter your name" required>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="Enter phone number" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create password" required>
            </div>

            <div class="input-box">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="btn">Register</button>

            <div class="login-link">
                Already have an account?
                <a href="#">Login</a>
            </div>

        </form>
    </div>

</body>
</html>
